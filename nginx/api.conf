# Hanzo API Gateway - Nginx Configuration
# Routes: gateway.hanzo.ai, api.hanzo.ai, store-api.hanzo.ai

upstream gateway {
    server gateway:3001;
}

upstream embeddings {
    server embeddings:3002;
}

upstream store {
    server store:3003;
}

# Main API (api.hanzo.ai)
server {
    listen 80;
    server_name api.hanzo.ai;

    # Embeddings endpoint
    location /embeddings {
        proxy_pass http://embeddings/v1/embeddings;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/embeddings {
        proxy_pass http://embeddings/v1/embeddings;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://embeddings/health;
        proxy_http_version 1.1;
    }

    location / {
        return 404 '{"error": "Not found"}';
        add_header Content-Type application/json;
    }
}

# Gateway (gateway.hanzo.ai)
server {
    listen 80;
    server_name gateway.hanzo.ai;

    location / {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

# Store API (store-api.hanzo.ai)
server {
    listen 80;
    server_name store-api.hanzo.ai;

    location / {
        proxy_pass http://store;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Default server (catch-all)
server {
    listen 80 default_server;
    server_name _;

    location /health {
        return 200 '{"status": "ok"}';
        add_header Content-Type application/json;
    }

    location / {
        return 404 '{"error": "Unknown host"}';
        add_header Content-Type application/json;
    }
}
