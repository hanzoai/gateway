name: Mirror Container Images to GHCR

on:
  workflow_dispatch:
  schedule:
    # Weekly on Sunday at 04:00 UTC
    - cron: '0 4 * * 0'

env:
  REGISTRY: ghcr.io/hanzoai

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - source: devopsfaith/krakend:2.5
            target: gateway-upstream
            tags: "2.5,latest"
          - source: bitnami/mongodb:latest
            target: mongodb
            tags: "latest"
          - source: registry:2
            target: registry
            tags: "2,latest"
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull upstream image
        run: docker pull ${{ matrix.source }}

      - name: Tag and push
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "${{ matrix.tags }}"
          for tag in "${TAG_ARRAY[@]}"; do
            docker tag ${{ matrix.source }} ${{ env.REGISTRY }}/${{ matrix.target }}:${tag}
            docker push ${{ env.REGISTRY }}/${{ matrix.target }}:${tag}
          done
