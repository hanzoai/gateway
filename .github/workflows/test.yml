name: Test

on:
  push:
    branches: [main]
  pull_request:

# Mirror the gateway Dockerfile build env (the green deploy path):
#   - GOEXPERIMENT=jsonv2 routes the in-process zip mount through
#     encoding/json/v2 (same source, v1 fallback if unset).
#   - The module knobs match Dockerfile stage 1: hanzoai/* + luxfi/* resolve
#     via the immutable public proxy against the committed go.sum, only
#     zap-proto/* stays first-party-direct. Any module that falls through to
#     `direct` is fetched over authenticated git — see the per-job
#     "Configure private module auth" step (secrets.GH_PAT).
env:
  GOEXPERIMENT: jsonv2
  GOPRIVATE: github.com/zap-proto/*
  GONOSUMDB: github.com/zap-proto/*
  GOSUMDB: off
  GOPROXY: https://proxy.golang.org,direct
  GOFLAGS: -mod=mod

jobs:
  go-vet:
    name: Go Vet
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.26.4'
          cache-dependency-path: ./go.mod

      - name: Configure private module auth
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Run go vet
        run: go vet ./...

  validate-configs:
    name: Validate Gateway Configs
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.26.4'
          cache-dependency-path: ./go.mod

      - name: Configure private module auth
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"

      # The runner ships go (setup-go) but not make/wget, so build the edge
      # binary directly rather than via `make build`. VERSION is read from the
      # Makefile (single source of truth); stamping core.KrakendVersion is
      # what lura writes into the User-Agent the integration fixtures assert.
      - name: Build gateway binary
        run: |
          VERSION=$(sed -n 's/^VERSION := *//p' Makefile)
          go build -tags legacy \
            -ldflags="-X github.com/hanzoai/gateway/v2/internal/lura/core.KrakendVersion=${VERSION}" \
            -o gateway ./cmd/gateway

      - name: Validate hanzo config
        run: ./gateway check -c configs/hanzo/gateway.json

      - name: Validate lux config
        run: ./gateway check -c configs/lux/gateway.json

  go-tests:
    name: Go Tests
    runs-on: hanzo-build-linux-amd64
    needs: [go-vet]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.26.4'
          cache-dependency-path: ./go.mod

      - name: Configure private module auth
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"

      # Same direct build as validate-configs — the lura integration harness
      # (tests/) execs this ./gateway binary against the fixture specs.
      - name: Build gateway binary
        run: |
          VERSION=$(sed -n 's/^VERSION := *//p' Makefile)
          go build -tags legacy \
            -ldflags="-X github.com/hanzoai/gateway/v2/internal/lura/core.KrakendVersion=${VERSION}" \
            -o gateway ./cmd/gateway

      # Unit packages + the lura integration harness in one pass. The -skip
      # set excludes upstream fixtures for behaviours this edge fork
      # deliberately diverges from — its own CORS preflight (not security/cors),
      # its own backend-error surface, plus a few CEL/Lua/redirect/negotiate
      # cases — tracked in LLM.md as separate work. 46 of 58 integration cases
      # plus every unit package gate CI.
      # `-tags legacy` is REQUIRED for the integration harness to run at all:
      # tests/{integration,integration_test,integration_example_test}.go are all
      # `//go:build legacy`, so an untagged `go test ./...` resolves ./tests to
      # zero files and silently skips every fixture. Without the tag this step
      # exercised only the unit packages while the -skip list above implied the
      # 46 integration cases were gating — they were not. The tag also builds
      # the legacy engine that actually ships (Makefile BUILD_TAGS ?= legacy).
      #
      # -gateway_startup_wait raises the harness's default 1500ms fixed sleep:
      # the edge binary is ~190MB and a loaded runner can exceed 1.5s before it
      # binds :8080, which surfaces as "connection refused" on every fixture.
      - name: Run unit tests
        run: |
          go test -count=1 -timeout=10m -tags legacy \
            $(go list -tags legacy ./... | grep -v '/tests$')

      # Separate step because the harness needs -args, and `go test ./... -args`
      # forwards the flag to EVERY package's test binary — the unit packages do
      # not define -gateway_startup_wait and abort with "flag provided but not
      # defined".
      - name: Run integration harness
        run: |
          go test -count=1 -timeout=10m -tags legacy \
            -skip 'ExampleNewIntegration|TestNewIntegration/(cors_1|cors_2|cors_3|cors_4|cors_5|cel-1|cel-2|lua_2|router_redirect|backend_404|integration_jsonschema|negotitate_plain)' \
            ./tests -args -gateway_startup_wait=30s
