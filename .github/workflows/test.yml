name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-vet:
    name: Go Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.26'
          cache-dependency-path: ./go.mod

      - name: Run go vet
        run: go vet ./...

  validate-configs:
    name: Validate Gateway Configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.26'
          cache-dependency-path: ./go.mod

      - name: Build gateway binary
        run: make build

      - name: Validate hanzo config
        run: ./gateway check -c configs/hanzo/gateway.json

      - name: Validate lux config
        run: ./gateway check -c configs/lux/gateway.json

  go-tests:
    name: Go Tests
    runs-on: ubuntu-latest
    needs: [go-vet]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v4
        with:
          go-version: '1.26'
          cache-dependency-path: ./go.mod

      - name: Build gateway binary
        run: make build

      - name: Start gateway in background
        run: |
          ./gateway run -c configs/hanzo/gateway.json &
          sleep 3
        env:
          GATEWAY_ROUTES_FILE: routes.yaml

      - name: Run unit tests
        run: go test -v -count=1 -timeout=5m ./...
        env:
          SKIP_INTEGRATION: "true"

      - name: Run integration tests
        run: go test -v -count=1 -timeout=5m ./tests/...
        continue-on-error: true
