name: CI/CD

# The gate for hanzoai/gateway, on the native runners (git.hanzo.ai → git-runner).
# The ~7-line caller shape every hanzo/lux/zoo repo carries: triggers plus the
# import. All real config is the repo-root hanzo.yml, which platform.hanzo.ai
# reads too, so no build logic lives here and none moved.
#
# The pipeline lives at .github/workflows because that is the one path BOTH
# planes read: github.com, now canonical for source, resolves nothing else, and
# the forge reads it as well. Two things about that are load-bearing.
#
# 1. THE DIRECTORY, AND ONLY ONE OF THEM. Gitea collects workflows from the
#    FIRST of WORKFLOW_DIRS that exists in the pushed commit and ignores the
#    rest (modules/actions/workflows.go, listWorkflowsInDirs — it breaks on the
#    first hit). So two directories is not redundancy, it is a coin flip: the
#    loser is not collected at all — no run, no queued job, no error. This
#    repo keeps exactly one, and a pipeline that stops silently is the failure
#    it can least afford.
#
# 2. THE `uses:` PATH. Not cosmetic. The reusable is resolved through the same
#    directory allowlist as the workflow itself, so the referenced path has to
#    be one the resolving host collects. github.com resolves ONLY
#    .github/workflows, and the forge reads that path too, so pointing there
#    resolves on both. hanzoai/ci publishes the pipeline at that single address
#    from v2 on; v1 is the older layout and is untouched.
#
# The runner label is unchanged because it was already right: hanzoai/ci
# defaults `runner` to ["linux-amd64"], which the git-runners
# actually advertise. A label nothing advertises does not fail a job, it queues
# it until the 24h timeout — silence, not an error.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Per-REF, so this can only ever cancel a superseded run of the same branch or
# the same tag. A `v*` tag has a ref of its own and cannot be cancelled by a
# push to main. Cancelling is right here because hanzo.yml is a test-only
# caller — it declares no `images:` and no `deploy:`, and hanzoai/ci skips both
# for such a caller — so a superseded run has nothing to leave half-done. If
# this repo ever gains a deploy: block, this flips to false in the same commit.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    secrets: inherit
