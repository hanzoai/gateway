name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  NODE_REPO: hanzoai/node

jobs:
  # ==========================================================================
  # Create GitHub Release
  # ==========================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:
      - name: Checkout gateway repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout node repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NODE_REPO }}
          path: hanzo-node
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "## Changes" > CHANGELOG.md
            git log --pretty=format:"- %s (%h)" >> CHANGELOG.md
          else
            echo "## Changes since $PREV_TAG" > CHANGELOG.md
            git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" >> CHANGELOG.md
          fi

          echo "" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## Docker Image" >> CHANGELOG.md
          echo '```bash' >> CHANGELOG.md
          echo "docker pull hanzoai/gateway:${{ steps.version.outputs.version }}" >> CHANGELOG.md
          echo '```' >> CHANGELOG.md

          cat CHANGELOG.md

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: Release v${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}

  # ==========================================================================
  # Build Release Binaries
  # ==========================================================================
  build-binaries:
    name: Build Release Binaries
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: hanzo_node
            asset_name: hanzo-gateway-linux-amd64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: hanzo_node
            asset_name: hanzo-gateway-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: hanzo_node
            asset_name: hanzo-gateway-macos-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: hanzo_node
            asset_name: hanzo-gateway-macos-arm64

    steps:
      - name: Checkout node repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.NODE_REPO }}
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }}

      - name: Create archive
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ${{ matrix.asset_name }}-v${{ needs.create-release.outputs.version }}.tar.gz \
            ${{ matrix.artifact_name }} \
            hanzo-tools-runner-resources || true

      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: target/${{ matrix.target }}/release/${{ matrix.asset_name }}-v${{ needs.create-release.outputs.version }}.tar.gz
          asset_name: ${{ matrix.asset_name }}-v${{ needs.create-release.outputs.version }}.tar.gz
          asset_content_type: application/gzip

  # ==========================================================================
  # Update Latest Release
  # ==========================================================================
  update-latest:
    name: Update Latest Tag
    needs: [create-release, build-binaries]
    runs-on: ubuntu-latest
    if: ${{ !github.event.inputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update latest tag
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -f latest
          git push origin latest --force

  # ==========================================================================
  # Notify Release
  # ==========================================================================
  notify:
    name: Notify Release
    needs: [create-release, build-binaries]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Release summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: v${{ needs.create-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Pre-release**: ${{ github.event.inputs.prerelease || false }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Image" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull hanzoai/gateway:${{ needs.create-release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "docker pull hanzoai/gateway:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release Assets" >> $GITHUB_STEP_SUMMARY
          echo "- Linux AMD64: hanzo-gateway-linux-amd64-v${{ needs.create-release.outputs.version }}.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- Linux ARM64: hanzo-gateway-linux-arm64-v${{ needs.create-release.outputs.version }}.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- macOS AMD64: hanzo-gateway-macos-amd64-v${{ needs.create-release.outputs.version }}.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo "- macOS ARM64: hanzo-gateway-macos-arm64-v${{ needs.create-release.outputs.version }}.tar.gz" >> $GITHUB_STEP_SUMMARY
