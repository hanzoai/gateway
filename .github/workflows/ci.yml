name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '20.x'

jobs:
  test:
    name: Run Gateway Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: gateway/package-lock.json

      - name: Install dependencies
        working-directory: gateway
        run: npm ci

      - name: Create .env file
        working-directory: gateway
        run: |
          cat > .env << EOF
          DIGITALOCEAN_API_KEY=${{ secrets.DIGITALOCEAN_API_KEY }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          NODE_ENV=test
          INFERENCE_PORT=3001
          EMBEDDING_PORT=3002
          EOF

      - name: Start test server
        working-directory: gateway
        run: |
          node test-server.js &
          sleep 5
        env:
          DIGITALOCEAN_API_KEY: ${{ secrets.DIGITALOCEAN_API_KEY }}

      - name: Run API tests
        working-directory: gateway
        run: npm test
        env:
          DIGITALOCEAN_API_KEY: ${{ secrets.DIGITALOCEAN_API_KEY }}

      - name: Generate test report
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ All API tests passed" >> $GITHUB_STEP_SUMMARY

  build:
    name: Build Application
    needs: test
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build --if-present

      - name: Create deployment package
        run: |
          mkdir -p dist
          cp -r src dist/ || echo "No src directory"
          cp package*.json dist/
          cp -r nginx dist/
          cp docker-compose.yml dist/
          tar -czf inference-gateway-${{ github.sha }}.tar.gz dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: inference-gateway-${{ github.sha }}
          path: inference-gateway-${{ github.sha }}.tar.gz
          retention-days: 30

  integration-test:
    name: Integration Tests
    needs: test
    runs-on: ubuntu-latest
    if: success()
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hanzo_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: hanzo_gateway
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        working-directory: gateway
        run: npm ci

      - name: Run integration tests
        working-directory: gateway
        run: npm run test:integration --if-present
        env:
          DIGITALOCEAN_API_KEY: ${{ secrets.DIGITALOCEAN_API_KEY }}
          DATABASE_URL: postgresql://hanzo_user:test_password@localhost:5432/hanzo_gateway
          REDIS_URL: redis://localhost:6379/0
          NODE_ENV: test

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=moderate || true

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

  # Docker builds are handled by build-and-push.yml workflow

  # Deployment is handled by build-and-push.yml workflow
