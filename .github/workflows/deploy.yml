name: Build and Deploy Gateway

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    uses: hanzoai/.github/.github/workflows/docker-build.yml@main
    with:
      image: ghcr.io/hanzoai/gateway
      deploy: true
      deploy-deployment: gateway
      deploy-namespace: hanzo
    secrets: inherit
