name: Build and Deploy Gateway

on:
  push:
    branches: [main, test, dev]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # Inline build (not the shared reusable workflow): the gateway pulls private
  # cross-repo Go modules (hanzoai/cloud, hanzoai/zip, luxfi/*) that need an
  # authenticated git token at build time. Resolving secrets.GH_PAT in THIS
  # repo's own job context (org secret, ALL visibility) is reliable; the same
  # reference through a reusable workflow's `secrets: inherit` resolves empty.
  docker:
    runs-on: hanzo-build-linux-amd64
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Reset Docker credential store (runner hygiene)
        run: |
          mkdir -p "$HOME/.docker"
          printf '{}' > "$HOME/.docker/config.json"
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hanzoai/gateway
          tags: |
            type=sha,prefix=sha-,suffix=-amd64,format=short
            type=ref,event=tag
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          build-args: |
            GO_EXPERIMENT=jsonv2
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          provenance: false
          cache-from: type=gha,scope=gateway-amd64
          cache-to: type=gha,scope=gateway-amd64,mode=max
          secrets: |
            gh_token=${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

  dispatch-to-universe:
    needs: docker
    runs-on: hanzo-build-linux-amd64
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/') || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Compute image tag
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          elif [[ "$GITHUB_REF" == refs/heads/* ]]; then
            TAG="${GITHUB_REF#refs/heads/}"
          else
            TAG="${GITHUB_SHA}"
          fi
          echo "image=ghcr.io/hanzoai/gateway:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Dispatch image update to universe
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.UNIVERSE_DISPATCH_TOKEN }}
          repository: hanzoai/universe
          event-type: image-update
          client-payload: |
            {
              "service": "gateway",
              "image": "${{ steps.meta.outputs.image }}",
              "sha": "${{ github.sha }}",
              "repo": "${{ github.repository }}"
            }

      - name: Summary
        run: |
          echo "### Deploy dispatched to universe" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** ${{ steps.meta.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Flow:** image-receiver -> dev branch -> staging deploy -> E2E -> PR to main -> production" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Track progress: https://github.com/hanzoai/universe/actions" >> "$GITHUB_STEP_SUMMARY"
