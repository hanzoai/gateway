apiVersion: apps/v1
kind: Deployment
metadata:
  name: hanzo-ingress
  namespace: hanzo
  labels:
    app: hanzo-ingress
    app.kubernetes.io/name: hanzo-ingress
    app.kubernetes.io/part-of: hanzo-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hanzo-ingress
  template:
    metadata:
      labels:
        app: hanzo-ingress
    spec:
      containers:
        - name: ingress
          image: ghcr.io/hanzoai/gateway:2.14.1
          command: ["/usr/bin/ingress"]
          args: ["-c", "/etc/ingress/ingress.json"]
          env:
            # IAM authority for hosts marked "auth": true in ingress.json
            # (e.g. goproxy.hanzo.ai). Same JWKS / issuer / audience as the
            # gateway so both trust one IAM. The in-code defaults already
            # match these; set explicitly for operator clarity.
            - name: AUTH_JWKS_URL
              value: "https://hanzo.id/v1/iam/.well-known/jwks"
            - name: AUTH_ISSUER
              value: "https://hanzo.id"
            - name: AUTH_AUDIENCE
              value: "https://api.hanzo.ai"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "2"
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/ingress
      volumes:
        - name: config
          configMap:
            name: ingress-config
