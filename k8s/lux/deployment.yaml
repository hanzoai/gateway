apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: lux-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: gateway
          image: ghcr.io/hanzoai/gateway:lux-latest
          imagePullPolicy: Always
          command: ["/usr/bin/gateway"]
          args: ["run", "-c", "/etc/gateway/gateway.json", "-d"]
          env:
            - name: GATEWAY_PORT
              value: "8080"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /__health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /__health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/gateway
      volumes:
        - name: config
          configMap:
            name: gateway-config
