apiVersion: apps/v1
kind: Deployment
metadata:
  name: krakend
  namespace: lux-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: krakend
  template:
    metadata:
      labels:
        app: krakend
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: krakend
          image: registry.hanzo.ai/gateway:lux-latest
          command: ["/usr/bin/krakend"]
          args: ["run", "-c", "/etc/krakend/krakend.json", "-d"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /__health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /__health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/krakend
      volumes:
        - name: config
          configMap:
            name: krakend-config
