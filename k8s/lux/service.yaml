apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: lux-gateway
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-name: lux-api-gateway
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: 8080
  type: LoadBalancer
