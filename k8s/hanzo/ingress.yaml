apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  namespace: hanzo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: ingress
  # The gateway is the ONE edge router. Every host below terminates at the
  # gateway Service, which applies global IAM-JWT + rate-limit and then dispatches
  # by host/path from routes.yaml (redirects + backends). This is why the console
  # Service (console2) no longer runs its own Ingress.
  #   api.hanzo.ai → cloud package (cloud), gated. ONE API host — no .cloud.
  #   cloud.hanzo.ai / admin.hanzo.ai   → console2 SPA at "/" + gated /v1.
  #   console.hanzo.ai / console2.hanzo.ai → 301 → cloud.hanzo.ai (routes.yaml).
  tls:
  - hosts:
    - api.hanzo.ai
    - cloud.hanzo.ai
    - admin.hanzo.ai
    - console.hanzo.ai
    - console2.hanzo.ai
    secretName: gateway-tls
  rules:
  - host: api.hanzo.ai
    http: &gateway
      paths:
      # Agent Skills Discovery is public + served by the cloud binary (which
      # white-labels by the preserved Host). This more-specific prefix wins over
      # `/` in Traefik, so /.well-known/agent-skills bypasses the gateway's IAM
      # gate and reaches cloud directly, while every other path still flows
      # through the gateway. One edit on the shared anchor covers every host
      # below (api/cloud/admin/console/console2.hanzo.ai).
      - path: /.well-known/agent-skills
        pathType: Prefix
        backend:
          service:
            name: cloud
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 8080
  - host: cloud.hanzo.ai
    http: *gateway
  - host: admin.hanzo.ai
    http: *gateway
  - host: console.hanzo.ai
    http: *gateway
  - host: console2.hanzo.ai
    http: *gateway
