apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  namespace: hanzo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: ingress
  # The gateway is the ONE edge router. Every host below terminates at the
  # gateway Service, which applies global IAM-JWT + rate-limit and then dispatches
  # by host/path from routes.yaml (redirects + backends). This is why the console
  # Service (console2) no longer runs its own Ingress.
  #   api.hanzo.ai / api.cloud.hanzo.ai → cloud package (cloud-api), gated.
  #   cloud.hanzo.ai / admin.hanzo.ai   → console2 SPA at "/" + gated /v1.
  #   console.hanzo.ai / console2.hanzo.ai → 301 → cloud.hanzo.ai (routes.yaml).
  tls:
  - hosts:
    - api.hanzo.ai
    - api.cloud.hanzo.ai
    - cloud.hanzo.ai
    - admin.hanzo.ai
    - console.hanzo.ai
    - console2.hanzo.ai
    secretName: gateway-tls
  rules:
  - host: api.hanzo.ai
    http: &gateway
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
              number: 8080
  - host: api.cloud.hanzo.ai
    http: *gateway
  - host: cloud.hanzo.ai
    http: *gateway
  - host: admin.hanzo.ai
    http: *gateway
  - host: console.hanzo.ai
    http: *gateway
  - host: console2.hanzo.ai
    http: *gateway
