apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: hanzo
  labels:
    app: gateway
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: hanzo-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: gateway
          image: ghcr.io/hanzoai/gateway:v2.14.10
          imagePullPolicy: Always
          command: ["/usr/bin/gateway"]
          args: ["run", "-c", "/etc/gateway/gateway.json"]
          env:
            - name: GATEWAY_PORT
              value: "8080"
            # -- Unified Auth Middleware --
            - name: AUTH_JWKS_URL
              value: "https://hanzo.id/v1/iam/.well-known/jwks"
            - name: AUTH_ISSUER
              value: "https://hanzo.id"
            - name: AUTH_PUBLIC_PATHS
              value: "/healthz,/__stats,/.well-known/,/favicon"
            - name: AUTH_PUBLIC_HOSTS
              value: "hanzo.id,lux.id,pars.id,id.bootno.de,id.zoo.network,iam.hanzo.ai"
            # Set to "true" to require auth on all non-public endpoints
            - name: AUTH_REQUIRE
              value: "false"
            # -- ZAP native binary listener (TLS 1.3+PQ) --
            #
            # TWO listeners, and they are not peers. ZAP_LISTENER_PORT is the
            # PUBLIC one: the TLS terminator, which is what zap-ingress
            # (zap.hanzo.ai) forwards to and the only ZAP thing on an interface
            # this pod shares with anyone. ZAP_INTERNAL_ADDR is where it forwards
            # AFTER decrypting — the plaintext ZAP server, on LOOPBACK, on a
            # DIFFERENT port.
            #
            # These both said 9999. Same process, same port, so one of two things
            # happened on every boot depending on which bound first: the
            # terminator proxied every accepted connection back into itself
            # (unbounded accept loop off one unauthenticated SYN), or it failed
            # with "address already in use" — logged, never fatal — and PLAINTEXT
            # ZAP served the public LoadBalancer. ZAP has no session crypto in any
            # language, so that second one is bearer tokens and prompts in
            # cleartext. The pod reports Ready either way.
            #
            # The binary now refuses both shapes at startup rather than picking
            # one, so this file and zaplisten.go have to agree; they do.
            - name: ZAP_LISTENER_ENABLED
              value: "true"
            - name: ZAP_LISTENER_PORT
              value: "9999"
            - name: ZAP_TLS_CERT
              value: "/etc/tls/tls.crt"
            - name: ZAP_TLS_KEY
              value: "/etc/tls/tls.key"
            - name: ZAP_INTERNAL_ADDR
              value: "127.0.0.1:9998"
            # -- Billing enforcement via Commerce API --
            - name: AUTH_BILLING_URL
              value: "http://commerce.hanzo.svc.cluster.local:8001"
            # Admin-scoped S2S token the balance gate uses to call Commerce.
            # REQUIRED from KMS (gateway-secrets) whenever BILLING_ENABLED=true:
            # the gateway refuses to start without it (AuthConfig.Validate). It
            # stays optional here only because billing is OFF (BILLING_ENABLED
            # unset); populate it from KMS before flipping billing on.
            - name: COMMERCE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: COMMERCE_SERVICE_TOKEN
                  optional: true
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9999
              name: zap
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/gateway
            - name: tls
              mountPath: /etc/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: gateway-config
        - name: tls
          secret:
            secretName: api-hanzo-ai-tls
