apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: hanzo
  labels:
    app: gateway
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: hanzo-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: gateway
          image: ghcr.io/hanzoai/gateway:latest
          imagePullPolicy: Always
          command: ["/usr/bin/gateway"]
          args: ["run", "-c", "/etc/gateway/gateway.json"]
          env:
            - name: GATEWAY_PORT
              value: "8080"
            # -- Unified Auth Middleware --
            - name: AUTH_JWKS_URL
              value: "https://hanzo.id/.well-known/jwks"
            - name: AUTH_ISSUER
              value: "https://hanzo.id"
            - name: AUTH_PUBLIC_PATHS
              value: "/__health,/__stats,/.well-known/,/favicon"
            - name: AUTH_PUBLIC_HOSTS
              value: "hanzo.id,lux.id,pars.id,id.bootno.de,id.zoo.network,iam.hanzo.ai"
            # Set to "true" to require auth on all non-public endpoints
            - name: AUTH_REQUIRE
              value: "false"
            # -- Billing enforcement via Commerce API --
            - name: AUTH_BILLING_URL
              value: "http://commerce.hanzo.svc.cluster.local:8001"
            - name: COMMERCE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gateway-secrets
                  key: COMMERCE_SERVICE_TOKEN
                  optional: true
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /__health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /__health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/gateway
      volumes:
        - name: config
          configMap:
            name: gateway-config
