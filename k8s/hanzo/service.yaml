apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: hanzo
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: zap
      port: 9999
      targetPort: 9999
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: hanzo-ingress
  namespace: hanzo
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-disable-lets-encrypt-dns-records: "true"
    service.beta.kubernetes.io/do-loadbalancer-name: hanzo-ingress
    service.beta.kubernetes.io/do-loadbalancer-size-unit: "1"
  labels:
    app: hanzo-ingress
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8080
      protocol: TCP
  type: LoadBalancer
  externalTrafficPolicy: Local
---
# Dedicated TCP LoadBalancer for ZAP binary protocol.
# DNS: zap.hanzo.ai → this LB's external IP.
apiVersion: v1
kind: Service
metadata:
  name: zap-ingress
  namespace: hanzo
  annotations:
    service.beta.kubernetes.io/do-loadbalancer-name: zap-ingress
    service.beta.kubernetes.io/do-loadbalancer-size-unit: "1"
spec:
  selector:
    app: gateway
  ports:
    - name: zap
      port: 9999
      targetPort: 9999
      protocol: TCP
  type: LoadBalancer
  externalTrafficPolicy: Local
