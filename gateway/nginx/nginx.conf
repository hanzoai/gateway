# Hanzo AI Inference Gateway - Nginx Configuration
# Serves: inference.hanzo.ai + embedding.hanzo.ai

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=global:10m rate=100r/s;
    limit_req_zone $http_x_device_id zone=device:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=inference:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=embedding:10m rate=100r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Upstream servers
    upstream inference_backend {
        least_conn;
        server inference:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream embedding_backend {
        least_conn;
        server embedding:3002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream admin_backend {
        server admin:3003 max_fails=3 fail_timeout=30s;
    }

    # ==========================================
    # HTTP -> HTTPS Redirect
    # ==========================================
    server {
        listen 80;
        server_name inference.hanzo.ai embedding.hanzo.ai admin.hanzo.ai;
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ==========================================
    # Inference Service (inference.hanzo.ai)
    # ==========================================
    server {
        listen 443 ssl http2;
        server_name inference.hanzo.ai;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/inference.hanzo.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/inference.hanzo.ai/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Rate limiting
        limit_req zone=inference burst=100 nodelay;
        limit_req zone=device burst=40 nodelay;
        limit_conn addr 20;

        # Health check (no auth required)
        location /health {
            proxy_pass http://inference_backend;
            access_log off;
        }

        # Main API
        location / {
            proxy_pass http://inference_backend;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Connection "";
            
            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
            
            # Buffering
            proxy_buffering off;
            proxy_request_buffering off;
            
            # WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ==========================================
    # Embedding Service (embedding.hanzo.ai)
    # ==========================================
    server {
        listen 443 ssl http2;
        server_name embedding.hanzo.ai;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/embedding.hanzo.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/embedding.hanzo.ai/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Rate limiting (embeddings are cheaper, allow more)
        limit_req zone=embedding burst=200 nodelay;
        limit_conn addr 50;

        # Health check
        location /health {
            proxy_pass http://embedding_backend;
            access_log off;
        }

        # Embedding API
        location / {
            proxy_pass http://embedding_backend;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            # Timeouts (embeddings are fast)
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }

    # ==========================================
    # Admin Dashboard (admin.hanzo.ai)
    # ==========================================
    server {
        listen 443 ssl http2;
        server_name admin.hanzo.ai;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/admin.hanzo.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.hanzo.ai/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;

        # Admin only - strict rate limiting
        limit_req zone=global burst=20 nodelay;
        limit_conn addr 5;

        location / {
            proxy_pass http://admin_backend;
            proxy_http_version 1.1;
            
            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
