# Canonical CI/CD config for hanzoai/gateway — read by the hanzoai/ci reusable
# workflow (.hanzo/workflows/cicd.yml) and by platform.hanzo.ai.
#
# TEST ONLY, deliberately. This repo had NO workflow at all, so `make test` was
# never a gate anywhere: it went years reporting `build constraints exclude all
# Go files` on every tree, healthy or broken, and nothing looked. Turning the
# GATE on is this file's whole job.
#
# `images:` and `deploy:` are intentionally absent. The edge image is rolled by
# an explicitly pinned tag in k8s/*/deployment.yaml (a reviewed decision, per
# cluster); wiring the build+push+rollout lane here would change how a
# production gateway ships, which is a separate call to make deliberately — not
# a side effect of fixing the test gate. hanzoai/ci handles a test-only caller
# natively ("no images: in hanzo.yml — test-only caller, skipping build").
test:
  - name: go-test
    # `make test`, not a bare `go test` — the target carries the three things a
    # bare run gets wrong: BUILD_TAGS=legacy (every file under tests/ is behind
    # //go:build legacy, and so is the engine the shipping image runs), the
    # `build` prerequisite (the fixture harness spawns ./gateway as the system
    # under test), and a second, UNTAGGED pass so the `!legacy` half is gated too
    # (cmd/gateway/main_test.go had never executed). It runs ./... both ways, so
    # the root package's own suites — auth, CORS, widget security, production
    # headers, AI-endpoint routing — are in scope as they build in each image.
    run: |
      set -e
      export GOPRIVATE='github.com/hanzoai/*' GOWORK=off
      make test
  - name: go-vet
    # `make lint`, for the same reason the step above is `make test`: the two
    # vet runs live in the Makefile and are called from here. The DEFAULT
    # (untagged) build is the HIP-0110 ZAP relay — a different file set from
    # the legacy edge — so both are vetted and neither half rots unnoticed.
    run: |
      set -e
      export GOPRIVATE='github.com/hanzoai/*' GOWORK=off
      make lint
